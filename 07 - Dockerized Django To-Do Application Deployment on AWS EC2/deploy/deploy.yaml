
apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-todo
  labels:
    app: django-todo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: django-todo
  template:
    metadata:
      labels:
        app: django-todo
    spec:
      containers:
        - name: django-todo
          image: yuvi2102/django-todo:latest
          ports:
            - containerPort: 8000
